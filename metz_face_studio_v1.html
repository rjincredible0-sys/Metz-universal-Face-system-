<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>METZ FACE STUDIO</title>
<style>
:root { --glow:#ff9d00; --core:#ffe45c; --speed:1; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:#050505; color:#f5f5f5; font-family:Arial,sans-serif; display:flex; flex-direction:column; }
header { padding:18px 16px 10px; text-align:center; letter-spacing:3px; }
header h1 { margin:0; font-size:20px; color:var(--core); text-shadow:0 0 12px var(--glow); }
header p { margin:7px 0 0; color:#888; font-size:11px; letter-spacing:1px; }
main { width:min(100%,650px); margin:auto; padding:12px; display:flex; flex-direction:column; gap:16px; }
.stage { aspect-ratio:1/1; width:100%; max-height:58vh; min-height:260px; background:radial-gradient(ellipse at center,#17100a 0%,#080808 48%,#000 78%); border:1px solid #292018; border-radius:22px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; box-shadow:inset 0 0 35px #000,0 0 25px #ff8c0014; }
.eyes { width:84%; display:flex; justify-content:space-between; align-items:center; gap:7%; transform:translateY(0); }
.eye { width:46%; height:clamp(62px,17vw,118px); position:relative; background:linear-gradient(180deg,var(--core),var(--glow)); border:4px solid #ff6a00; border-radius:52% 52% 46% 46% / 58% 58% 42% 42%; box-shadow:0 0 8px var(--core),0 0 20px var(--glow),0 0 42px #ff6a0080; overflow:hidden; transition:height .18s ease, transform .25s ease, border-radius .2s ease; }
.eye:before { content:""; position:absolute; inset:10% 22%; border:4px solid #7b2900; border-radius:50%; box-shadow:0 0 8px #7b2900; }
.pupil { position:absolute; width:34%; height:54%; left:33%; top:23%; background:radial-gradient(circle at 35% 30%,#2b1000 0 15%,#080300 55%,#000 100%); border:3px solid #8b3900; border-radius:50%; box-shadow:0 0 7px #542000; transition:transform .25s ease; }
.eye:after { content:""; position:absolute; width:27%; height:13%; left:18%; top:12%; border-radius:50%; background:#fff6c4; filter:blur(5px); opacity:.85; }
.brow { position:absolute; width:43%; height:13px; top:25%; background:var(--glow); filter:drop-shadow(0 0 7px var(--glow)); border-radius:100%; z-index:2; }
.brow.left { left:9%; transform:rotate(12deg); }
.brow.right { right:9%; transform:rotate(-12deg); }
.stage.blink .eye { height:7px; border-radius:50%; }
.stage.happy .eye { height:70px; border-radius:8% 8% 65% 65%; transform:rotate(0deg); }
.stage.surprised .eye { height:clamp(80px,21vw,140px); border-radius:50%; }
.stage.angry .brow.left { transform:rotate(25deg) translateY(7px); }
.stage.angry .brow.right { transform:rotate(-25deg) translateY(7px); }
.stage.sleepy .eye { height:42px; }
.stage.sleepy .brow { opacity:.4; }
.badge { position:absolute; bottom:14px; color:#a66b25; font-size:10px; letter-spacing:2px; }
.controls { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
button { border:1px solid #493016; border-radius:12px; background:#15100b; color:#ffd27a; padding:12px 8px; font-weight:600; font-size:12px; }
button:active,button.active { background:#482600; border-color:#ff9d00; box-shadow:0 0 12px #ff8c0040; }
.settings { display:grid; grid-template-columns:1fr 1fr; gap:12px; background:#101010; border:1px solid #242424; padding:14px; border-radius:14px; }
label { color:#aaa; font-size:11px; display:flex; flex-direction:column; gap:8px; }
input { width:100%; accent-color:#ff9d00; }
.actions { display:flex; gap:8px; }
.actions button { flex:1; }
footer { text-align:center; color:#555; font-size:10px; padding:10px 8px 18px; }
@media (min-width:600px) { .stage { max-height:520px; } }
</style>
</head>
<body>
<header><h1>METZ FACE STUDIO</h1><p>UNIVERSAL ROBOT FACE • PROTOTYPE 01</p></header>
<main>
  <section class="stage" id="stage" aria-label="Animated robotic eyes preview">
    <div class="eyes">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
      <div class="brow left"></div><div class="brow right"></div>
    </div>
    <div class="badge" id="status">METZ • READY</div>
  </section>
  <section class="controls" aria-label="Expressions">
    <button data-face="normal" class="active">Normal</button>
    <button data-face="happy">Happy</button>
    <button data-face="angry">Angry</button>
    <button data-face="surprised">Surprised</button>
    <button data-face="sleepy">Sleepy</button>
    <button id="blinkBtn">Blink</button>
  </section>
  <section class="settings">
    <label>Eye colour
      <input id="colour" type="color" value="#ff9d00">
    </label>
    <label>Animation speed
      <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
    </label>
    <label>Glow brightness
      <input id="brightness" type="range" min="0.3" max="1.5" step="0.1" value="1">
    </label>
    <label>Look direction
      <input id="look" type="range" min="-1" max="1" step="1" value="0">
    </label>
  </section>
  <div class="actions">
    <button id="autoBtn">Pause animation</button>
    <button id="fullBtn">Fullscreen preview</button>
  </div>
</main>
<footer>Prototype only — watch transfer and device compatibility come in a later stage.</footer>
<script>
const stage=document.getElementById('stage');
const statusText=document.getElementById('status');
const pupils=[...document.querySelectorAll('.pupil')];
let current='normal', auto=true, timer;
function setFace(face){
 current=face; stage.className='stage '+face;
 document.querySelectorAll('[data-face]').forEach(b=>b.classList.toggle('active',b.dataset.face===face));
 statusText.textContent='METZ • '+face.toUpperCase();
}
document.querySelectorAll('[data-face]').forEach(b=>b.addEventListener('click',()=>setFace(b.dataset.face)));
function blink(){stage.classList.add('blink');setTimeout(()=>stage.classList.remove('blink'),180);}
document.getElementById('blinkBtn').addEventListener('click',blink);
document.getElementById('colour').addEventListener('input',e=>{
 document.documentElement.style.setProperty('--glow',e.target.value);
 const c=e.target.value;
 document.documentElement.style.setProperty('--core',mix(c,'#fff36b',.58));
});
function mix(a,b,t){
 const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);
 const r=Math.round(((x>>16)*(1-t)+(y>>16)*t)),g=Math.round((((x>>8)&255)*(1-t)+((y>>8)&255)*t)),bl=Math.round(((x&255)*(1-t)+(y&255)*t));
 return '#'+[r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
}
document.getElementById('brightness').addEventListener('input',e=>{
 const v=Number(e.target.value);stage.style.filter=`brightness(${v})`;
});
document.getElementById('look').addEventListener('input',e=>{
 const x=Number(e.target.value)*9;
 pupils.forEach(p=>p.style.transform=`translateX(${x}px)`);
});
let speed=1;
document.getElementById('speed').addEventListener('input',e=>speed=Number(e.target.value));
function start(){clearTimeout(timer);if(!auto)return;timer=setTimeout(()=>{
 if(current==='normal'){const r=Math.random();if(r<.55)blink();else {const x=(Math.random()*2-1)*7;pupils.forEach(p=>p.style.transform=`translateX(${x}px)`);}}
 start();
},Math.max(900,2600/speed));}
document.getElementById('autoBtn').addEventListener('click',e=>{
 auto=!auto;e.target.textContent=auto?'Pause animation':'Resume animation';start();
});
document.getElementById('fullBtn').addEventListener('click',()=>{
 if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.();
});
start();
</script>
</body>
</html>
